<ion-content><section class="login-screen"><div class="login-mark"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="7" width="22" height="22" rx="3"/><path d="M10 3v8M22 3v8M5 15h22M11 20h1m8 0h1m-10 5h1m8 0h1"/></svg></div><h1>Рабочий день<br>под контролем.</h1><p class="login-description">Откройте расписание, найдите исследование и измените его данные.</p>
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()"><div class="login-field"><label for="username">Логин</label><input id="username" type="text" formControlName="username" autocomplete="username" [attr.aria-invalid]="submitted && f['username'].invalid"/><p class="field-error" *ngIf="submitted && f['username'].invalid">Введите логин</p></div><div class="login-field"><label for="password">Пароль</label><input id="password" type="password" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="submitted && f['password'].invalid"/><p class="field-error" *ngIf="submitted && f['password'].invalid">Введите пароль</p></div><button class="login-submit" [disabled]="loading">{{loading?'Открываем…':'Открыть демо'}}</button><p role="alert" class="field-error" *ngIf="error">{{error}}</p></form>
<p class="login-hint">Данные для входа: <strong>test / test</strong></p><p class="login-footer">Только синтетические данные.</p></section></ion-content>
