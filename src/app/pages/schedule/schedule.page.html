<ion-button id="open-create-modal" expand="block">Create</ion-button>
<ion-button id="open-edit-modal" expand="block" [disabled]="!tableService.selectedItem">Edit</ion-button>
<ion-button (click)="deleteAlert()" expand="block" [disabled]="!tableService.selectedItem">Delete</ion-button>
<app-table
  [columns]="gridColumns"
  [options]="gridOptions"
  [data]="gridData"
  (onAngularGridCreated)="tableService.angularGridReady($event.detail)"
  (onGridStateChanged)="tableService.gridStateChanged($event.detail)"
  (onBeforeGridDestroy)="tableService.saveCurrentGridState()"
  (onRowCountChanged)="tableService.refreshMetrics($event.detail.eventData, $event.detail.args)"
  (onSelectedRowsChanged)="tableService.onSelectedRowsChanged($event)"
>
</app-table>

<!--Create modal-->
<ion-modal trigger="open-create-modal" #newModal (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Cancel</ion-button>
        </ion-buttons>
        <ion-title>Welcome</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="confirm(newItem, 'new')" [strong]="true">Add</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-item>
        <ion-input
          label="ФИО Пациента"
          labelPlacement="stacked"
          type="text"
          placeholder="ФИО Пациеинта"
          [(ngModel)]="newItem.patient_fio"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Исследование"
          labelPlacement="stacked"
          type="text"
          placeholder="Исследование"
          [(ngModel)]="newItem.investigation_name"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Статус"
          labelPlacement="stacked"
          type="text"
          placeholder="Статус"
          [(ngModel)]="newItem.status"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Тара"
          labelPlacement="stacked"
          type="text"
          placeholder="Тара"
          [(ngModel)]="newItem.tape"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Отклонение"
          labelPlacement="stacked"
          type="text"
          placeholder="Отклонение"
          [(ngModel)]="newItem.deviation"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Штрих-код"
          labelPlacement="stacked"
          type="text"
          placeholder="Штрих-код"
          [(ngModel)]="newItem.bar_code"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Пункт забора крови"
          labelPlacement="stacked"
          type="text"
          placeholder="Пункт забора крови"
          [(ngModel)]="newItem.bcp_name"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Дата приема"
          labelPlacement="stacked"
          type="text"
          placeholder="Дата приема"
          [(ngModel)]="newItem.date_direction"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Завершено"
          labelPlacement="stacked"
          type="text"
          placeholder="Завершено"
          [(ngModel)]="newItem.completed"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="ID Пациента"
          labelPlacement="stacked"
          type="text"
          placeholder="Дата приема"
          [(ngModel)]="newItem.patient_id"
        ></ion-input>
      </ion-item>


      <ion-item>
        <ion-select label="Stacked label" label-placement="stacked">
          <ion-select-option value="apple">Apple</ion-select-option>
          <ion-select-option value="banana">Banana</ion-select-option>
          <ion-select-option value="orange">Orange</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-content>
  </ng-template>
</ion-modal>
